<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Found | The Affluentaccelerators</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <script>
    // Clean URL Redirector for static hosts & GitHub Pages:
    // If a visitor accesses /careers, /events, /forms, or /admin without .html,
    // this instantly routes them to the matching page while keeping the clean URL visible.
    (function() {
      try {
        var p = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';

        // Known extensionless pages
        var knownPages = ['careers', 'events', 'forms', 'admin'];
        var segments = p.split('/').filter(Boolean);
        var lastSeg = segments[segments.length - 1];

        if (lastSeg && knownPages.indexOf(lastSeg) !== -1) {
          // Reconstruct path with .html extension
          segments[segments.length - 1] = lastSeg + '.html';
          var redirectUrl = (p.startsWith('/') ? '/' : '') + segments.join('/') + search + hash;
          window.location.replace(redirectUrl);
          return;
        }

        // Generic fallback for any other extensionless page
        if (!p.endsWith('.html') && !p.endsWith('/')) {
          window.location.replace(p + '.html' + search + hash);
          return;
        }
      } catch (e) {}
    })();
  </script>
  <style>
    body {
      margin: 0;
      background-color: #06261b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 480px;
      background: #03150e;
      border: 1px solid rgba(229, 184, 59, 0.3);
      border-radius: 20px;
      padding: 40px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .logo {
      max-width: 280px;
      height: auto;
      margin-bottom: 24px;
    }
    h1 {
      color: #f3c74d;
      font-size: 20px;
      margin: 0 0 12px 0;
      letter-spacing: 0.5px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 24px 0;
    }
    a.btn {
      display: inline-block;
      background: linear-gradient(135deg, #e5b83b, #d4af37);
      color: #03150e;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 12px 28px;
      border-radius: 12px;
      transition: transform 0.2s, background 0.2s;
    }
    a.btn:hover {
      background: #f3c74d;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="images/affluentaccelerators-logo.png" alt="The Affluentaccelerators" class="logo">
    <h1>Redirecting you...</h1>
    <p>Please wait a moment while we locate the requested page, or return to our homepage below.</p>
    <a href="./" class="btn">Return to Homepage</a>
  </div>
</body>
</html>
